name: Flutter CI - Guía 11 Pruebas

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Guia-11/pruebas_flutter/**'
      - '.github/workflows/flutter_ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Guia-11/pruebas_flutter/**'
      - '.github/workflows/flutter_ci.yml'

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Guia-11/pruebas_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Check coverage threshold (85%)
        run: |
          chmod +x scripts/check_coverage.sh
          ./scripts/check_coverage.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: Guia-11/pruebas_flutter/coverage/
          retention-days: 7